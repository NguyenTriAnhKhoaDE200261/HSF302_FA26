<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Chi tiết sinh viên</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <h4 class="mb-0"><i class="bi bi-person-badge me-2"></i>Thông tin chi tiết sinh viên</h4>
                    <a th:href="@{/students}" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-arrow-left me-1"></i>Quay lại danh sách
                    </a>
                </div>
                <div class="card-body">
                    <table class="table table-bordered mb-4">
                        <tr>
                            <th class="w-25 bg-light">ID:</th>
                            <td th:text="${student.id}">1</td>
                        </tr>
                        <tr>
                            <th class="bg-light">Họ và tên:</th>
                            <td class="fw-bold" th:text="${student.name}">Nguyễn Văn A</td>
                        </tr>
                        <tr>
                            <th class="bg-light">Email:</th>
                            <td th:text="${student.email}">a@fpt.edu.vn</td>
                        </tr>
                        <tr>
                            <th class="bg-light">Tuổi:</th>
                            <td th:text="${student.age}">20</td>
                        </tr>
                        <tr>
                            <th class="bg-light">Chuyên ngành:</th>
                            <td>
                                <span class="badge bg-secondary" th:text="${student.major}">CNTT</span>
                            </td>
                        </tr>
                        <tr>
                            <th class="bg-light">Điểm GPA:</th>
                            <td>
                                <span th:text="${student.gpa}"
                                      th:class="${student.gpa >= 3.5 ? 'gpa-high' : (student.gpa >= 3.0 ? 'gpa-mid' : 'gpa-low')}">3.5</span>
                            </td>
                        </tr>
                    </table>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/students/{id}/edit(id=${student.id})}" class="btn btn-warning text-white">
                            <i class="bi bi-pencil me-1"></i>Chỉnh sửa
                        </a>
                        <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#deleteModal">
                            <i class="bi bi-trash me-1"></i>Xóa sinh viên
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Xóa -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Xác nhận xóa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    Bạn có chắc chắn muốn xóa sinh viên <b th:text="${student.name}"></b> không?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <form th:action="@{/students/{id}/delete(id=${student.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-danger">Xóa</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
