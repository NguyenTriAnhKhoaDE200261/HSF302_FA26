<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${tieuDe}">Cập nhật sinh viên</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<main class="container py-4" style="max-width: 600px;">
    <h1 class="h3 mb-4" th:text="${tieuDe}">Cập nhật thông tin</h1>

    <form th:action="@{/sinhvien/sua}" th:object="${sinhVien}" method="post" class="card p-4 shadow-sm">

        <!-- Mã SV dùng input dạng hidden để giữ nguyên giá trị không cho sửa khóa chính, hoặc hiển thị readonly -->
        <div class="mb-3">
            <label for="maSV" class="form-label">Mã sinh viên</label>
            <input type="text" id="maSV" class="form-control" th:field="*{maSV}" readonly>
        </div>

        <div class="mb-3">
            <label for="hoTen" class="form-label">Họ và tên</label>
            <input type="text" id="hoTen" class="form-control" th:field="*{hoTen}" required>
        </div>

        <div class="mb-3">
            <label for="diemTB" class="form-label">Điểm trung bình</label>
            <input type="number" step="0.1" min="0" max="10" id="diemTB" class="form-control" th:field="*{diemTB}" required>
        </div>

        <div class="d-flex justify-content-between">
            <a th:href="@{/sinhvien}" class="btn btn-secondary">Quay lại danh sách</a>
            <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
        </div>
    </form>
</main>
</body>
</html>
