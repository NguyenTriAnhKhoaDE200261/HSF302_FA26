<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${tieuDe}">Danh sách</title>
    <!-- Sử dụng Bootstrap offline -->
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<main class="container py-4">

    <!-- Giữ lại 1 tiêu đề và nút Thêm mới cho gọn -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 m-0" th:text="${tieuDe}">Danh sách sinh viên</h1>
        <a th:href="@{/sinhvien/them}" class="btn btn-primary">Thêm sinh viên mới</a>
    </div>

    <!-- Nếu danh sách KHÔNG rỗng -> hiện bảng -->
    <table class="table table-bordered table-hover bg-white"
           th:unless="${#lists.isEmpty(sinhViens)}">
        <thead class="table-dark">
        <tr>
            <th style="width: 5%;">#</th>
            <th style="width: 15%;">Mã SV</th>
            <th style="width: 30%;">Họ tên</th>
            <th class="text-end" style="width: 15%;">Điểm TB</th>
            <th style="width: 15%;">Xếp loại</th>
            <th class="text-center" style="width: 20%;">Thao tác</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="sv, stat : ${sinhViens}">
            <!-- 1. STT -->
            <td th:text="${stat.count}">1</td>

            <!-- 2. Mã SV -->
            <td th:text="${sv.maSV}">SV001</td>

            <!-- 3. Họ tên -->
            <td th:text="${sv.hoTen}">Nguyễn Văn A</td>

            <!-- 4. Điểm TB -->
            <td class="text-end" th:text="${#numbers.formatDecimal(sv.diemTB, 1, 1)}">8.5</td>

            <!-- 5. Xếp loại -->
            <td>
                <span th:if="${sv.diemTB >= 8.0}" class="badge bg-success">Giỏi</span>
                <span th:if="${sv.diemTB >= 6.5 and sv.diemTB < 8.0}" class="badge bg-primary">Khá</span>
                <span th:if="${sv.diemTB < 6.5}" class="badge bg-danger">Trung bình</span>
            </td>

            <!-- 6. Thao tác (Sửa / Xóa) -->
            <td class="text-center">
                <a th:href="@{/sinhvien/sua/{id}(id=${sv.maSV})}" class="btn btn-sm btn-warning me-1">Sửa</a>
                <a th:href="@{/sinhvien/xoa/{id}(id=${sv.maSV})}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Bạn có chắc chắn muốn xóa sinh viên này không?');">Xóa</a>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Nếu danh sách RỖNG -> hiện thông báo -->
    <div th:if="${#lists.isEmpty(sinhViens)}" class="alert alert-info">
        Không có sinh viên nào.
    </div>

    <p class="text-muted" th:unless="${#lists.isEmpty(sinhViens)}">
        Tổng: <strong th:text="${#lists.size(sinhViens)}">0</strong> sinh viên
    </p>
</main>
</body>
</html>
