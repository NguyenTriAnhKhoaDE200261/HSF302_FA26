spring.application.name=Demo
server.port=8080

# T?t cache Thymeleaf ?? s?a template không c?n kh?i ??ng l?i ?ng d?ng
spring.thymeleaf.cache=false

# C?u hình k?t n?i SQL Server (?ã có s?n trong project c?a b?n)
