<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; background: #f4f6f9; color: #1c2530; margin: 0; padding: 40px; }
        .container { max-width: 600px; margin: 0 auto; }
        .alert-danger { background: #f8d7da; color: #7a1f27; border: 1px solid #eec2c6; padding: 14px 18px; border-radius: 6px; margin-bottom: 20px; font-weight: bold; }
        .btn { display: inline-block; padding: 8px 18px; background: #2471a3; color: #fff; text-decoration: none; border-radius: 4px; font-size: 14px; }
        .btn:hover { background: #1a5276; }
    </style>
</head>
<body>
<div class="container">
    <div class="alert-danger" th:text="${errorMessage}">Something went wrong while processing your request. Please go back and try again.</div>
    <a th:href="@{/}" class="btn">Back to list</a>
</div>
</body>
</html>
